name: Release binaries

# Builds the binaries for a release and attaches them to it, then publishes
# the release. release-plz creates the tag and the (draft) GitHub Release and
# dispatches this workflow (see release-plz.yml); running it by hand retries
# a failed build against an existing release without re-tagging.
# Installed official builds pick a published release up within a day (see
# src/update.rs).
#
# Assets are static binaries, gzip-compressed: `atelier-<target>.gz`.
# - x86_64 is built with fullrust (https://github.com/KarpelesLab/fullrust):
#   no libc at all, the binary only needs a Linux kernel.
# - arm64 is built against musl, as fullrust is x86-64 only for now.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  # gh release upload/edit.
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: The checkout is the release tag, and it matches Cargo.toml
        run: |
          got="$(git describe --tags --exact-match --match "$TAG")"
          if [ "$got" != "$TAG" ]; then
            echo "::error::checked out '$got', expected release tag '$TAG'"
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "Building $TAG at $(git rev-parse HEAD)"

  build-x86_64:
    needs: check
    runs-on: ubuntu-latest
    # The fullrust toolchain image: in it, a plain `cargo build` targets
    # x86_64-unknown-linux-fullrust.
    container: ghcr.io/karpeleslab/fullrust:1.99
    env:
      TARGET: x86_64-unknown-linux-fullrust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Build
        env:
          # Marks the build as official: it then updates itself from releases.
          ATELIER_RELEASE_TARGET: ${{ env.TARGET }}
        # Not `--locked`: the image substitutes its libc-free getrandom,
        # which changes that one entry of the lock file.
        run: cargo build --release
      - name: Smoke test
        run: ./target/$TARGET/release/atelier --version | grep -F "($TARGET)"
      - name: Stage
        run: gzip -9 -c target/$TARGET/release/atelier > atelier-$TARGET.gz
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-${{ env.TARGET }}
          path: atelier-${{ env.TARGET }}.gz
          if-no-files-found: error

  build-aarch64:
    needs: check
    runs-on: ubuntu-24.04-arm
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          ATELIER_RELEASE_TARGET: ${{ env.TARGET }}
        run: cargo build --release --locked --target $TARGET
      - name: Smoke test
        run: ./target/$TARGET/release/atelier --version | grep -F "($TARGET)"
      - name: Stage
        run: gzip -9 -c target/$TARGET/release/atelier > atelier-$TARGET.gz
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-${{ env.TARGET }}
          path: atelier-${{ env.TARGET }}.gz
          if-no-files-found: error

  release:
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        # Of the files as published (compressed): the updater verifies a
        # download before decompressing it.
        run: |
          cd dist
          sha256sum atelier-*.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          # Only now does it become the latest release the updater looks at.
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
