name: Release

# Push a tag `vX.Y.Z` (matching Cargo.toml's version) to publish a release.
# Installed official builds pick it up within a day (see src/update.rs).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          # Marks the build as official: it then updates itself from releases.
          ATELIER_RELEASE_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/atelier --version
      - name: Stage
        run: cp target/${{ matrix.target }}/release/atelier atelier-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-${{ matrix.target }}
          path: atelier-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum atelier-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
